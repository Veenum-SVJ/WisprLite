name: Android checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x gradlew
      - name: Restore persistent development signing key
        env:
          DEVELOPMENT_KEY: ${{ secrets.WISPRLITE_DEBUG_KEYSTORE }}
        run: |
          mkdir -p .tools
          printf '%s' "$DEVELOPMENT_KEY" | base64 --decode > .tools/wisprlite-debug.keystore
      - name: Restore licensed typography when configured
        env:
          YOWZA_FONT_01: ${{ secrets.YOWZA_FONT_01 }}
          YOWZA_FONT_02: ${{ secrets.YOWZA_FONT_02 }}
          YOWZA_FONT_03: ${{ secrets.YOWZA_FONT_03 }}
          YOWZA_FONT_04: ${{ secrets.YOWZA_FONT_04 }}
          YOWZA_FONT_05: ${{ secrets.YOWZA_FONT_05 }}
          YOWZA_FONT_06: ${{ secrets.YOWZA_FONT_06 }}
          YOWZA_FONT_07: ${{ secrets.YOWZA_FONT_07 }}
          YOWZA_FONT_08: ${{ secrets.YOWZA_FONT_08 }}
          YOWZA_FONT_09: ${{ secrets.YOWZA_FONT_09 }}
        run: |
          if [ -n "$YOWZA_FONT_01" ]; then
            mkdir -p .tools/licensed-fonts
            printf '%s' "$YOWZA_FONT_01" "$YOWZA_FONT_02" "$YOWZA_FONT_03" "$YOWZA_FONT_04" "$YOWZA_FONT_05" "$YOWZA_FONT_06" "$YOWZA_FONT_07" "$YOWZA_FONT_08" "$YOWZA_FONT_09" | base64 --decode > .tools/yowza-fonts.zip
            unzip -q -o .tools/yowza-fonts.zip -d .tools/licensed-fonts
          fi
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wisprlite-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-*.html


